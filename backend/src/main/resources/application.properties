spring.application.name=mnp-backend

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/mnp_db}
spring.datasource.username=${DB_USERNAME:mnp_user}
spring.datasource.password=${DB_PASSWORD:mnp_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Database initialization is managed through database/schema.sql
spring.sql.init.mode=never

# Porting request timeout
mnp.porting-request.timeout-minutes=2
mnp.porting-request.cleanup-interval-ms=10000
